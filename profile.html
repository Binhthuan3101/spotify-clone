<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="./src/src/style.css" />
    <script
      src="https://kit.fontawesome.com/ff53e92e9d.js"
      crossorigin="anonymous"
    ></script>
    <title>Spotify - Profile</title>
  </head>
  <body class="p-6 bg-[#121212] text-white min-h-screen font-sans">
    <!-- Header Navbar -->
    <header class="border-b border-gray-800">
      <div class="flex justify-between items-center px-8 pb-4">
        <a
          href="./index.html"
          class="text-3xl gap-2 font-bold text-foreground-base hover:opacity-90 flex justify-center items-center"
        >
          <span><i class="fa-brands fa-spotify"></i></span>
          <span>Spotify</span>
        </a>
        <div class="flex gap-3 items-center">
          <a
            class="text-base px-3 py-1.5 text-white hover:text-green-600 font-bold"
            href="#!"
            >Các gói Premium</a
          >
          <a
            class="text-base px-3 py-1.5 text-white hover:text-green-600 font-bold"
            href="#!"
            >Hỗ trợ</a
          >
          <a
            class="text-base px-3 py-1.5 text-white hover:text-green-600 font-bold"
            href="#!"
            >Tải xuống</a
          >
          <div class="w-[2px] h-5 bg-white"></div>
          <button
            id="btn-logout"
            class="bg-transparent hover:text-green-600 px-4 py-1.5 rounded text-lg font-semibold cursor-pointer"
          >
            Đăng xuất
          </button>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main
      class="max-w-xl mx-auto bg-[#2A2A2A] p-6 sm:p-8 rounded-xl shadow-xl"
    >
      <h1
        class="text-3xl font-bold text-foreground-base mb-6 pb-2 border-b border-gray-800"
      >
        Thông tin cá nhân
      </h1>

      <div id="profile-container" class="space-y-6">
        <div class="animate-pulse text-gray-400 text-center py-8">
          Đang tải thông tin cá nhân...
        </div>
      </div>
    </main>

    <script type="module">
      import { httpRequest } from "./src/libs/httpRequest.js";

      const logoutBtn = document.querySelector("#btn-logout");
      const profileContainer = document.querySelector("#profile-container");
      const token = localStorage.getItem("access_token");
      const refreshToken = localStorage.getItem("refresh_token");

      // 1. Kiểm tra đã đăng nhập chưa
      if (!token && !refreshToken) {
        alert("Bạn cần đăng nhập để xem thông tin");
        window.location.href = "./login.html";
      }

      // 2. Đăng xuất
      logoutBtn.addEventListener("click",  () => {
        localStorage.clear();
        window.location.href="./login.html";
      });

      // 3. Lấy dữ liệu và hiển thị Profile
      // httpRequest đã tự động refresh token khi gặp 401
      async function loadUserProfile() {
        try {
          const responseData = await httpRequest.get("/api/users/me");
          // Có thể là: { data: { user } } | { data: user } | { user } | user
          const raw = responseData?.data ?? responseData;
          const user = raw?.user ?? raw;

          if (
            !user ||
            typeof user !== "object" ||
            user.status === 404 ||
            user.message === "Unauthorized" ||
            user.error
          ) {
            profileContainer.innerHTML = `<p class="text-red-400 text-center">Không thể lấy thông tin người dùng</p>`;
            return;
          }

          const fallbackImg =
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSt3xbjpqEjTdZ98pMXIgGabMHwyeK4Qyvyqi97np4-NQ&s=10";
          const avatarUrl =
            user.image_url ||
            user.profile_image ||
            fallbackImg;

          const username =
            user.display_name ||
            user.name ||
            user.username ||
            user.full_name ||
            "Chưa cập nhật";
          const email = user.email || "Chưa cập nhật";

          // Các field đã hiển thị riêng, không lặp lại
          const ignoreKeys = [
            "avatar",
            "avatar_url",
            "image_url",
            "profile_image",
            "name",
            "username",
            "display_name",
            "full_name",
            "email",
            "password",
            "password_hash",
          ];

          const otherFields = Object.entries(user).filter(
            ([key]) => !ignoreKeys.includes(key),
          );

          const otherFieldsHtml = otherFields
            .map(([key, value]) => {
              let displayValue = value;
              if (typeof value === "object" && value !== null) {
                displayValue = JSON.stringify(value, null, 2);
              } else if (
                value === null ||
                value === undefined ||
                value === ""
              ) {
                displayValue = "Chưa có dữ liệu";
              }
              return `
                <div>
                  <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-1">${key.replace(/_/g, " ")}</label>
                  <div class="bg-[#1f1f1f] p-3 rounded border border-gray-700 text-sm break-words text-gray-200 whitespace-pre-wrap">${displayValue}</div>
                </div>
              `;
            })
            .join("");

          profileContainer.innerHTML = `
            <!-- Avatar + Tên + Email -->
            <div class="flex flex-col sm:flex-row items-center gap-5 pb-6 border-b border-gray-800">
              <img
                src="${avatarUrl}"
                onerror="this.onerror=null; this.src='${fallbackImg}';"
                class="w-24 h-24 rounded-full object-cover border-2 border-white shadow-md"
                alt="Avatar"
              />
              <div class="text-center sm:text-left space-y-1">
                <h2 class="text-2xl font-bold text-white">${username}</h2>
                <p class="text-gray-400 text-sm">${email}</p>
              </div>
            </div>

            <!-- Chi tiết -->
            <div class="space-y-4">
              <div>
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-1">Tên hiển thị</label>
                <div class="bg-[#1f1f1f] p-3 rounded border border-gray-700 text-sm font-medium">${username}</div>
              </div>

              <div>
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-1">Email</label>
                <div class="bg-[#1f1f1f] p-3 rounded border border-gray-700 text-sm font-medium">${email}</div>
              </div>

              ${otherFieldsHtml}
            </div>
          `;
        } catch (error) {
          console.error("Lỗi khi tải profile:", error);

          // Token hết hạn / refresh fail → về login
          if (
            error.message?.includes("Unauthorized") ||
            error.message?.includes("Invalid token") ||
            error.message?.includes("Refresh token failed") ||
            error.message?.includes("No refresh token")
          ) {
            localStorage.removeItem("access_token");
            localStorage.removeItem("refresh_token");
            alert("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.");
            window.location.href = "./login.html";
            return;
          }

          profileContainer.innerHTML = `
            <p class="text-red-500 text-center">
              Đã xảy ra lỗi khi tải dữ liệu cá nhân!<br/>
              <span class="text-sm text-gray-400">${error.message || ""}</span>
            </p>
          `;
        }
      }

      loadUserProfile();
    </script>
  </body>
</html>
